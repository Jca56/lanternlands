[workspace]
resolver = "3"
members = ["crates/sim", "crates/game"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Alva"]

[workspace.dependencies]
sim = { path = "crates/sim" }
lntrn-math = { path = "../lantern-ui-2/crates/lntrn-math" }
lntrn-core = { path = "../lantern-ui-2/crates/lntrn-core" }
lntrn-image = { path = "../lantern-ui-2/crates/lntrn-image" }
lntrn-data = { path = "../lantern-ui-2/crates/lntrn-data" }
lntrn-render = { path = "../lantern-ui-2/crates/lntrn-render" }
lntrn-ui = { path = "../lantern-ui-2/crates/lntrn-ui" }
lntrn-app = { path = "../lantern-ui-2/crates/lntrn-app" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
lto = "thin"
