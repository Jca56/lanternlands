# Every sprite the game loads.
#
# file    the picture, inside this folder
# rect    [x, y, width, height] of the sprite in that picture; leave it
#         out when the sprite is the whole picture
# anchor  the pixel, counted from the rect's top-left corner, that stands
#         on the ground: the middle of the tile the sprite is on
#
# A [grids.name] table cuts a sheet of equal cells into sprites called
# name_row_column, one per cell, all with the same anchor in their cell.

# How many of the art's pixels a tile is across.
tile_px = 200

# The player on foot. The side view faces right; left is its mirror.
[grids.player]
file = "sprites/player-01.png"
cell = [240, 320]
anchor = [120, 286]
rows = ["down", "up", "side"]
columns = ["idle", "step_a", "pass", "step_b", "work_a", "work_b"]

# A goblin, laid out like the player: walking and swinging its club.
[grids.goblin]
file = "sprites/goblin-01.png"
cell = [320, 300]
anchor = [150, 264]
rows = ["down", "up", "side"]
columns = ["idle", "step_a", "pass", "step_b", "work_a", "work_b"]

