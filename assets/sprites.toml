# A fence is a post, and rails drawn behind it to whichever of its
# neighbours are fences too: to the east, to the west, and down the
# screen to the south (the fence to the north reaches down to this
# one). Each rail's anchor is its own post's foot, and it runs a few
# pixels past the edge of the tile, so that two meeting never gap.
[sprites.fence]
file = "sprites/fence.png"
rect = [0, 0, 100, 150]
anchor = [50, 130]

[sprites.fence_east]
file = "sprites/fence.png"
rect = [110, 0, 110, 102]
anchor = [3, 99]

[sprites.fence_west]
